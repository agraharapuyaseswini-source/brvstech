<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSS Renewal Reckoner</title>
<style>
:root{
  --ink:#17233b; --ink2:#3c4964; --muted:#6a7488; --bg:#e8ebf1; --surface:#ffffff;
  --line:#d9dfe8; --line2:#eaeef3;
  --brick:#c0392b; --brick-soft:#fbecea;
  --slate:#256074; --slate-soft:#e9f2f5;
  --tally:#1090c0;
  --tally-soft:#e6f4fb;
  --shadow:0 1px 2px rgba(23,35,59,.06),0 6px 22px rgba(23,35,59,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
header{
  position:sticky;top:0;z-index:20;background:#fff;
  border-bottom:2px solid var(--tally);
  box-shadow:0 2px 12px rgba(23,35,59,.06);
  padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0));
}
.hwrap{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{height:46px;width:auto;display:block;flex:0 0 auto}
.hsep{width:1px;align-self:stretch;background:var(--line);margin:3px 0}
.htext{min-width:0}
.illo{height:62px;width:auto;margin-left:auto;flex:0 0 auto;align-self:center}
@media (max-width:640px){.illo{display:none}}
.htitle{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0;color:var(--ink)}
.hsub{font-size:12.5px;color:var(--muted);margin:2px 0 0}
@media (max-width:520px){.logo{height:38px}.htitle{font-size:15px}.hsub{font-size:11px}}
main{max-width:1000px;margin:18px auto 0;padding:0 16px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.controls{padding:16px 16px 6px}
.ctrl{margin-bottom:12px}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:7px}
.seg-group{display:flex;flex-wrap:wrap;gap:8px}
.seg{
  appearance:none;cursor:pointer;font:inherit;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:9px 14px;color:var(--ink2);font-weight:500;line-height:1.2;
  text-align:left;transition:background .12s,border-color .12s,color .12s,transform .05s;
}
.seg:hover{border-color:#bcc6d6;background:#f6f8fb}
.seg:active{transform:translateY(1px)}
.seg .seg-sub{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}
.seg.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg.on .seg-sub{color:#b9c2d6}
.seg:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.hint{margin:2px 2px 0;font-size:12.5px;color:var(--muted)}
.card{overflow:hidden}
.goal{
  background:linear-gradient(180deg,#fbfcfd,#f4f6fa);
  border-bottom:1px solid var(--line);
  border-left:4px solid var(--brick);
  padding:14px 18px;
}
.metaline{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  font-size:11.5px;letter-spacing:.06em;color:var(--brick);font-weight:600;margin-bottom:5px}
.objective{font-size:16px;line-height:1.5;color:var(--ink);font-weight:500}
.cardbody{display:grid;grid-template-columns:1fr 1fr;gap:0}
.col{padding:16px 18px 20px}
.col.probe{border-right:1px solid var(--line2);background:#fcfdfe}
.chip{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;padding:4px 10px;border-radius:999px;margin-bottom:12px}
.chip-probe{color:var(--slate);background:var(--slate-soft)}
.chip-pitch{color:var(--brick);background:var(--brick-soft)}
.qlist{list-style:none;margin:0;padding:0;counter-reset:q}
.qlist li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line2)}
.qlist li:first-child{border-top:0;padding-top:2px}
.qlist .num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--slate);
  color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.qlist li span:last-child{font-size:15px;line-height:1.5;color:var(--ink)}
.feat{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line2)}
.feat:first-of-type{border-top:0;padding-top:2px}
.feat-hl{border-left:2px solid var(--tally);padding-left:10px}
.feat-hl .mk{background:var(--tally)}
.hl-star{display:inline-block;margin-left:6px;color:var(--tally);vertical-align:-2px}
.hl-star svg{width:13px;height:13px}
.mk{flex:0 0 auto;width:7px;height:7px;border-radius:2px;background:var(--brick);margin-top:8px}
.fname{font-weight:600;color:var(--ink);font-size:15px}
.fdesc{color:var(--muted);font-size:14px;line-height:1.5}
.bizlabel{margin:14px 0 4px;font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);padding-top:12px;border-top:1px dashed var(--line)}
.notposs{grid-column:1/-1;text-align:center;color:var(--muted);padding:34px 20px;font-size:15px}
.notposs span{display:block;margin-top:6px;font-size:13px;color:#98a1b2}
footer{max-width:1000px;margin:16px auto 0;padding:0 18px;color:var(--muted);font-size:12px}
@media (max-width:720px){
  .cardbody{grid-template-columns:1fr}
  .col.probe{border-right:0;border-bottom:1px solid var(--line2)}
  .seg{flex:1 1 auto;min-width:calc(50% - 4px)}
}
.resrow{display:flex;justify-content:flex-end;margin-bottom:2px}
.respill{
  display:inline-flex;align-items:center;gap:9px;cursor:pointer;font:inherit;
  font-weight:600;font-size:13.5px;color:#fff;background:var(--brick);
  border:1px solid var(--brick);border-radius:11px;padding:11px 16px;line-height:1.1;
  box-shadow:0 2px 8px rgba(192,57,43,.22);
  transition:background .12s,box-shadow .12s,transform .06s;
  animation:respulse 2.2s ease-out .9s 3;
}
.respill:hover{background:#a83226;box-shadow:0 4px 14px rgba(192,57,43,.3)}
.respill:active{transform:translateY(1px)}
.respill:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rp-ico{display:flex}.rp-ico svg{width:16px;height:16px}
.rp-chev{display:flex;opacity:.9}.rp-chev svg{width:17px;height:17px}
@media (max-width:560px){.resrow{justify-content:stretch}.respill{width:100%;justify-content:center}}
@keyframes respulse{
  0%{box-shadow:0 0 0 0 rgba(240,184,177,.85)}
  100%{box-shadow:0 0 0 13px rgba(240,184,177,0)}
}
.overlay{position:fixed;inset:0;background:rgba(20,28,46,.55);
  display:flex;align-items:flex-end;justify-content:center;z-index:50}
.overlay[hidden]{display:none}
@media (min-width:640px){.overlay{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:560px;max-height:86vh;overflow:auto;
  border-radius:16px 16px 0 0;box-shadow:0 -10px 44px rgba(0,0,0,.28)}
@media (min-width:640px){.modal{border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:18px 18px 8px;position:sticky;top:0;background:#fff}
.modal-head h2{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.modal-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.close{appearance:none;border:0;background:#eef1f6;color:var(--ink2);width:32px;height:32px;
  border-radius:8px;font-size:20px;line-height:1;cursor:pointer;flex:0 0 auto}
.close:hover{background:#e2e6ee}
.close:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.reslist{padding:6px 14px 20px;display:flex;flex-direction:column;gap:8px}
.rescard{display:flex;align-items:center;gap:12px;text-decoration:none;
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--ink);
  transition:background .12s,border-color .12s}
.rescard:hover{background:#f6f8fb;border-color:#c4cdda}
.rescard:focus-visible{outline:2px solid var(--brick);outline-offset:2px}
.rc-ico{flex:0 0 auto;width:34px;height:34px;border-radius:8px;background:var(--brick-soft);
  color:var(--brick);display:flex;align-items:center;justify-content:center}
.rc-ico svg{width:17px;height:17px}
.rc-main{flex:1 1 auto;min-width:0}
.rc-name{font-weight:600;font-size:14.5px;line-height:1.35}
.rc-tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.rc-open{flex:0 0 auto;color:#a6afbf}
.rc-open svg{width:16px;height:16px}
.rescard:hover .rc-open{color:var(--brick)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.respill{animation:none!important}}
@media print{
  body{background:#fff} header{position:static;color:#000;background:#fff;border-bottom:2px solid #000}
  .htitle b{color:#000}.hsub{color:#444}.controls{display:none}.resrow{display:none}.panel{box-shadow:none;border:1px solid #999}
  .col.probe{background:#fff}
}
</style>
</head>

let state = { usage:'power', release:'erp9', expiry:'recent' };
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function buildGroup(id, items, key){
  const c=document.getElementById(id); c.innerHTML='';
  items.forEach(it=>{
    const b=document.createElement('button');
    b.type='button'; b.className='seg'+(state[key]===it.k?' on':'');
    b.setAttribute('aria-pressed', state[key]===it.k);
    let html=esc(it.label);
    if(it.sub) html+='<span class="seg-sub">'+esc(it.sub)+'</span>';
    b.innerHTML=html;
    b.addEventListener('click',()=>{ state[key]=it.k; render(); });
    c.appendChild(b);
  });
}
function pitchItem(p){
  var hl=/tally\s*drive/i.test(p.name);
  var star = hl ? '<span class="hl-star" title="Key feature — always pitch"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 7.1-1.01z"/></svg></span>' : '';
  return '<div class="feat'+(hl?' feat-hl':'')+'"><span class="mk"></span><div><span class="fname">'+esc(p.name)+'</span>'+star+
    (p.desc?' <span class="fdesc">'+esc(p.desc)+'</span>':'')+'</div></div>';
}
function render(){
  buildGroup('g-usage', DATA.usages, 'usage');
  buildGroup('g-release', DATA.releases, 'release');
  buildGroup('g-expiry', DATA.expiries, 'expiry');
  const {usage,release,expiry}=state;
  const rel=DATA.relMeta[release];
  const exp=DATA.expiries.find(e=>e.k===expiry);
  const cell=DATA.data[usage][release][expiry];
  document.getElementById('metaline').textContent =
    (DATA.usageMeta[usage].label+' · '+rel.label+' · TSS '+exp.label).toUpperCase();
  document.getElementById('usagedesc').textContent = DATA.usageMeta[usage].desc;
  const body=document.getElementById('cardbody');
  if(cell.notPossible){
    document.getElementById('objective').textContent='';
    body.innerHTML='<div class="notposs">Not possible<span>Pick a different release or expiry.</span></div>';
    return;
  }
  document.getElementById('objective').textContent = rel.objective;
  const probeHtml = cell.probe.map((q,i)=>'<li><span class="num">'+(i+1)+'</span><span>'+esc(q)+'</span></li>').join('');
  const pitchHtml = cell.pitch.map(pitchItem).join('');
  const bizHtml = (cell.biz&&cell.biz.length)?('<div class="bizlabel">If it fits their business</div>'+cell.biz.map(pitchItem).join('')):'';
  body.innerHTML =
    '<div class="col probe"><span class="chip chip-probe">Probe · '+cell.probe.length+'</span><ol class="qlist">'+probeHtml+'</ol></div>'+
    '<div class="col pitch"><span class="chip chip-pitch">Pitch</span>'+pitchHtml+bizHtml+'</div>';
}
render();
